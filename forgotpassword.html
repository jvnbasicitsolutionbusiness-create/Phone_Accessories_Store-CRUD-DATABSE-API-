<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockFlow | Password Recovery</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="styles.css"></head><body><div class="auth-box" style="min-height:100vh"><div class="auth-card"><div class="brand">STOCKFLOW</div><h1>Password Recovery</h1><p class="muted">Use your registered username, email or phone number.</p><section id="requestStep"><form id="forgotForm" class="auth-form"><label>Account Identity</label><input id="identity" required><button>Send Recovery Code</button></form></section><section id="otpStep" class="hidden"><form id="recoveryOtpForm" class="auth-form"><label>Recovery Code</label><input name="otp" maxlength="6" inputmode="numeric" required><button>Verify Code</button></form></section><section id="resetStep" class="hidden"><form id="resetForm" class="auth-form"><label>New Password</label><input name="newPassword" type="password" minlength="8" required><label>Confirm Password</label><input name="confirmPassword" type="password" required><button>Reset Password</button></form></section><p id="message"></p><a class="link" href="auth.html">Back to login</a></div></div><script src="config.js"></script><script src="api.js"></script><script src="forgot-password.js"></script></body></html>
