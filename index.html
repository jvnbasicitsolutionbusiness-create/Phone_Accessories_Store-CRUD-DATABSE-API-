<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="STOCKFLOW — Phone Accessories Inventory Management System"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>STOCKFLOW | Inventory Management</title>

    <!--
        Entry-point page.
        Authentication begins at auth.html.
    -->

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           STOCKFLOW ENTRY SCREEN
           ===================================================== */

        .stockflow-entry {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 32px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.045),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 255, 255, 0.025),
                    transparent 35%
                ),
                #0b0f14;

            color: #ffffff;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            box-sizing: border-box;
        }


        /* =====================================================
           CONTENT
           ===================================================== */

        .stockflow-entry-card {

            width: min(100%, 460px);

            text-align: center;

            padding: 48px 36px;

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.035);

            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(12px);

            box-sizing: border-box;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .stockflow-entry-brand {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-bottom: 28px;
        }


        .stockflow-entry-mark {

            width: 46px;

            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background: #ffffff;

            color: #0b0f14;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.04em;
        }


        .stockflow-entry-name {

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            text-align: left;
        }


        .stockflow-entry-name strong {

            font-size: 20px;

            line-height: 1;

            letter-spacing: 0.08em;
        }


        .stockflow-entry-name span {

            margin-top: 5px;

            color: rgba(255, 255, 255, 0.52);

            font-size: 10px;

            font-weight: 600;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }


        /* =====================================================
           HEADING
           ===================================================== */

        .stockflow-entry-card h1 {

            margin: 0;

            font-size: clamp(26px, 5vw, 34px);

            line-height: 1.15;

            font-weight: 700;

            letter-spacing: -0.025em;
        }


        .stockflow-entry-card p {

            max-width: 360px;

            margin: 14px auto 0;

            color: rgba(255, 255, 255, 0.58);

            font-size: 14px;

            line-height: 1.7;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .stockflow-loading {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 30px;

            color: rgba(255, 255, 255, 0.72);

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.04em;
        }


        .stockflow-spinner {

            width: 15px;

            height: 15px;

            border: 2px solid rgba(255, 255, 255, 0.18);

            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                stockflow-spin
                0.8s linear infinite;
        }


        @keyframes stockflow-spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .stockflow-entry-footer {

            margin-top: 32px;

            padding-top: 20px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.07);

            color:
                rgba(255, 255, 255, 0.35);

            font-size: 10px;

            letter-spacing: 0.06em;

            text-transform: uppercase;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 520px) {

            .stockflow-entry {

                padding: 20px;
            }

            .stockflow-entry-card {

                padding: 38px 24px;

                border-radius: 16px;
            }

            .stockflow-entry-card h1 {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>

    <main
        class="stockflow-entry"
        aria-label="STOCKFLOW loading screen"
    >

        <section class="stockflow-entry-card">

            <!-- =================================================
                 BRAND
                 ================================================= -->

            <div class="stockflow-entry-brand">

                <div
                    class="stockflow-entry-mark"
                    aria-hidden="true"
                >
                    SF
                </div>

                <div class="stockflow-entry-name">

                    <strong>
                        STOCKFLOW
                    </strong>

                    <span>
                        Inventory Management System
                    </span>

                </div>

            </div>


            <!-- =================================================
                 CONTENT
                 ================================================= -->

            <h1>
                Phone Accessories Inventory
            </h1>

            <p>
                Centralized inventory management for
                products, stock movement, suppliers,
                categories, and transactions.
            </p>


            <!-- =================================================
                 LOADING
                 ================================================= -->

            <div
                class="stockflow-loading"
                role="status"
                aria-live="polite"
            >

                <span
                    class="stockflow-spinner"
                    aria-hidden="true"
                ></span>

                <span>
                    Opening STOCKFLOW...
                </span>

            </div>


            <!-- =================================================
                 FOOTER
                 ================================================= -->

            <footer class="stockflow-entry-footer">

                Secure Inventory Management

            </footer>

        </section>

    </main>


    <!-- =========================================================
         REDIRECT TO AUTHENTICATION
         ========================================================= -->

    <script>

        (() => {

            "use strict";

            /*
             * Keep index.html as the system entry point.
             * Authentication is handled by auth.html.
             */

            const AUTH_PAGE = "auth.html";

            /*
             * Small delay allows the branded entry screen
             * to render before navigation.
             */

            window.setTimeout(() => {

                window.location.replace(AUTH_PAGE);

            }, 350);

        })();

    </script>

</body>
</html>
