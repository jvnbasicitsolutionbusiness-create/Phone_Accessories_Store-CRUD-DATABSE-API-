<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions | StockFlow</title><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="styles.css"></head><body><div class="sf-layout"><aside class="sf-side"><div class="sf-brand">STOCKFLOW</div><div class="sf-nav">
<a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="stock-in.html">Stock In</a><a href="stock-out.html">Stock Out</a><a href="transactions.html">Transactions</a><a href="activity.html">Activity Log</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div></aside><main class="sf-main"><div class="sf-top"><div><div class="sf-title">Transactions</div><div class="sf-muted">Complete history of stock-in and stock-out movements.</div></div><button class="sf-btn secondary" data-menu>☰</button></div><div class="sf-card"><div class="sf-row"><button class="sf-btn secondary" id="all">All</button><button class="sf-btn secondary" id="ins">Stock In</button><button class="sf-btn secondary" id="outs">Stock Out</button></div></div><div class="sf-card"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Product</th><th>Qty</th><th>Total</th><th>User</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="main.js"></script><script>(async()=>{await StockFlowAuth.requireAuth();const q=id=>document.getElementById(id);async function load(type){const r=await StockFlowAPI.listTransactions(type?{type}:{});q("rows").innerHTML=(r.transactions||[]).map(x=>`<tr><td>${x.DATE||""}</td><td><span class="badge ${x.TYPE==="STOCK_IN"?"in":"out"}">${x.TYPE==="STOCK_IN"?"STOCK IN":"STOCK OUT"}</span></td><td>${x.REFERENCE}</td><td>${x.PRODUCT_NAME}</td><td>${x.QUANTITY}</td><td>₱${Number(x.TOTAL||0).toFixed(2)}</td><td>${x.USER||"-"}</td></tr>`).join("")||'<tr><td colspan="7">No transactions.</td></tr>'}q("all").onclick=()=>load();q("ins").onclick=()=>load("STOCK_IN");q("outs").onclick=()=>load("STOCK_OUT");load()})()</script></body></html>
