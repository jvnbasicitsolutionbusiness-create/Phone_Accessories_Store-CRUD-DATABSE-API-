<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="STOCKFLOW — Create an account for the Phone Accessories Inventory Management System"
    >

    <meta
        name="theme-color"
        content="#0b0f14"
    >

    <title>STOCKFLOW | Create Account</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0b0f14;
            color: #ffffff;
            font-family:
                Inter,
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;
        }

        .stockflow-register-redirect {
            width: min(100%, 460px);
            text-align: center;
            padding: 48px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.035);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .stockflow-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .stockflow-mark {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #ffffff;
            color: #0b0f14;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .stockflow-name {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .stockflow-name strong {
            font-size: 20px;
            line-height: 1;
            letter-spacing: 0.08em;
        }

        .stockflow-name span {
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stockflow-register-redirect h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .stockflow-register-redirect p {
            max-width: 350px;
            margin: 14px auto 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 14px;
            line-height: 1.7;
        }

        .stockflow-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.72);
            font-size: 12px;
            font-weight: 600;
        }

        .stockflow-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: stockflow-spin 0.8s linear infinite;
        }

        @keyframes stockflow-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .stockflow-continue {
            display: inline-block;
            margin-top: 24px;
            padding: 11px 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .stockflow-continue:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stockflow-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        @media (max-width: 520px) {
            body {
                padding: 18px;
            }

            .stockflow-register-redirect {
                padding: 38px 24px;
                border-radius: 16px;
            }

            .stockflow-register-redirect h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main
        class="stockflow-register-redirect"
        aria-label="STOCKFLOW registration"
    >

        <!-- BRAND -->

        <div class="stockflow-brand">

            <div
                class="stockflow-mark"
                aria-hidden="true"
            >
                SF
            </div>

            <div class="stockflow-name">

                <strong>
                    STOCKFLOW
                </strong>

                <span>
                    Inventory Management System
                </span>

            </div>

        </div>


        <!-- MESSAGE -->

        <h1>
            Create your account
        </h1>

        <p>
            Opening the STOCKFLOW registration page
            for the Phone Accessories Inventory Management System.
        </p>


        <!-- LOADING -->

        <div
            class="stockflow-loading"
            role="status"
            aria-live="polite"
        >

            <span
                class="stockflow-spinner"
                aria-hidden="true"
            ></span>

            <span>
                Opening registration...
            </span>

        </div>


        <!-- FALLBACK LINK -->

        <a
            href="auth.html#register"
            class="stockflow-continue"
        >
            Continue to Registration
        </a>


        <!-- FOOTER -->

        <footer class="stockflow-footer">

            STOCKFLOW • Phone Accessories Inventory

        </footer>

    </main>


    <script>
        (() => {
            "use strict";

            const REGISTER_PAGE = "auth.html#register";

            window.setTimeout(() => {
                window.location.replace(REGISTER_PAGE);
            }, 350);
        })();
    </script>

</body>
</html>
