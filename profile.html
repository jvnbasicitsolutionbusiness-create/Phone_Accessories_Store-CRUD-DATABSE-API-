<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StockFlow | My Profile</title>

    <!-- StockFlow CSS -->
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./modules.css">
</head>

<body>

    <div class="sf-layout">

        <!-- =========================
             SIDEBAR
        ========================== -->
        <aside class="sf-side">

            <div class="sf-brand">
                STOCKFLOW
            </div>

            <nav class="sf-nav">

                <a href="./dashboard.html">
                    Dashboard
                </a>

                <a href="./inventory-dashboard.html">
                    Inventory Dashboard
                </a>

                <a href="./products.html">
                    Products
                </a>

                <a href="./inventory.html">
                    Inventory
                </a>

                <a href="./categories.html">
                    Categories
                </a>

                <a href="./suppliers.html">
                    Suppliers
                </a>

                <a href="./stock-in.html">
                    Stock In
                </a>

                <a href="./stock-out.html">
                    Stock Out
                </a>

                <a href="./transactions.html">
                    Transactions
                </a>

                <a href="./activity.html">
                    Activity Log
                </a>

                <!-- Current Page -->
                <a
                    href="./profile.html"
                    class="active"
                    aria-current="page"
                >
                    Profile
                </a>

                <a href="./settings.html">
                    Settings
                </a>

            </nav>

        </aside>


        <!-- =========================
             MAIN CONTENT
        ========================== -->
        <main class="sf-main">

            <!-- Header -->
            <header class="sf-top">

                <div>
                    <div class="sf-title">
                        My Profile
                    </div>

                    <div class="sf-muted">
                        View your active STOCKFLOW account.
                    </div>
                </div>

                <button
                    class="sf-btn secondary"
                    data-menu
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                >
                    ☰
                </button>

            </header>


            <!-- =========================
                 PROFILE CARD
            ========================== -->
            <section class="sf-card">

                <div class="sf-card-head">

                    <div>
                        <h3>
                            Account Information
                        </h3>

                        <p class="sf-muted">
                            Your current STOCKFLOW account details.
                        </p>
                    </div>

                </div>


                <div class="profile-grid">

                    <!-- Full Name -->
                    <div class="profile-item">
                        <small>
                            FULL NAME
                        </small>

                        <h3 data-user-name>
                            —
                        </h3>
                    </div>


                    <!-- Role -->
                    <div class="profile-item">
                        <small>
                            ROLE
                        </small>

                        <h3 data-user-role>
                            —
                        </h3>
                    </div>


                    <!-- Email -->
                    <div class="profile-item">
                        <small>
                            EMAIL
                        </small>

                        <h3 data-user-email>
                            —
                        </h3>
                    </div>


                    <!-- Phone -->
                    <div class="profile-item">
                        <small>
                            PHONE
                        </small>

                        <h3 data-user-phone>
                            —
                        </h3>
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- =========================
         STOCKFLOW JAVASCRIPT
    ========================== -->
    <script src="./config.js"></script>
    <script src="./api.js"></script>
    <script src="./auth.js"></script>
    <script src="./main.js"></script>


    <!-- Profile Authentication -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {

            try {

                if (
                    typeof StockFlowAuth === "undefined" ||
                    typeof StockFlowAuth.requireAuth !== "function"
                ) {
                    console.error(
                        "StockFlowAuth is not available."
                    );
                    return;
                }

                const user =
                    await StockFlowAuth.requireAuth();

                if (
                    user &&
                    typeof StockFlowAuth.bindUserUI === "function"
                ) {
                    StockFlowAuth.bindUserUI(user);
                }

            } catch (error) {

                console.error(
                    "Unable to load profile:",
                    error
                );

            }

        });
    </script>

</body>
</html>
