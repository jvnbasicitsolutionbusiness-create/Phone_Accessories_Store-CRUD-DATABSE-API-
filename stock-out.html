<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Out | StockFlow</title><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="styles.css"></head><body><div class="sf-layout"><aside class="sf-side"><div class="sf-brand">STOCKFLOW</div><div class="sf-nav">
<a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="stock-in.html">Stock In</a><a href="stock-out.html">Stock Out</a><a href="transactions.html">Transactions</a><a href="activity.html">Activity Log</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div></aside><main class="sf-main"><div class="sf-top"><div><div class="sf-title">Stock Out</div><div class="sf-muted">Release inventory while preventing negative stock.</div></div><button class="sf-btn secondary" data-menu>☰</button></div><div id="alert" class="sf-alert"></div><div class="sf-card"><form id="form" class="sf-form"><select id="productId" required><option value="">Select product</option></select><input id="quantity" type="number" min="1" step="1" placeholder="Quantity" required><input id="unitCost" type="number" min="0" step=".01" placeholder="Unit cost"><input id="reference" placeholder="Reference number (optional)"><input id="supplier" placeholder="Supplier / source"><input id="note" placeholder="Note"><div class="full"><button class="sf-btn">Record Stock-Out</button></div></form></div><div class="sf-card"><h3>Current Inventory</h3><div id="current">Loading...</div></div></main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="main.js"></script><script>(async()=>{await StockFlowAuth.requireAuth();const q=id=>document.getElementById(id);const p=await StockFlowAPI.listProducts();q("productId").innerHTML='<option value="">Select product</option>'+(p.products||[]).map(x=>`<option value="${x.ID}">${x.SKU} — ${x.NAME} (available: ${x.STOCK})</option>`).join("");q("form").onsubmit=async e=>{e.preventDefault();const r=await StockFlowAPI.stockOut({productId:q("productId").value,quantity:q("quantity").value,reference:q("reference").value,note:q("note").value});q("alert").textContent=r.message;q("alert").className="sf-alert show "+(r.success?"success":"error");if(r.success){e.target.reset();load()}};async function load(){const r=await StockFlowAPI.listProducts();q("current").innerHTML=(r.products||[]).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${x.NAME}</b> — ${x.STOCK} units</div>`).join("")}load()})()</script></body></html>
