<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suppliers | StockFlow</title><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="styles.css"></head><body><div class="sf-layout"><aside class="sf-side"><div class="sf-brand">STOCKFLOW</div><div class="sf-nav">
<a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="stock-in.html">Stock In</a><a href="stock-out.html">Stock Out</a><a href="transactions.html">Transactions</a><a href="activity.html">Activity Log</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div></aside><main class="sf-main"><div class="sf-top"><div><div class="sf-title">Suppliers</div><div class="sf-muted">Maintain supplier contact records.</div></div><button class="sf-btn secondary" data-menu>☰</button></div><div id="alert" class="sf-alert"></div><div class="sf-card"><form id="form" class="sf-form"><input type="hidden" id="id"><input id="name" placeholder="Supplier name" required><input id="contactPerson" placeholder="Contact person"><input id="phone" placeholder="Phone"><input id="email" type="email" placeholder="Email"><input id="address" placeholder="Address"><select id="status"><option>ACTIVE</option><option>INACTIVE</option></select><div class="full sf-row"><button class="sf-btn">Save Supplier</button><button type="button" class="sf-btn secondary" id="clear">Clear</button></div></form></div><div class="sf-card"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="main.js"></script><script>(async()=>{await StockFlowAuth.requireAuth();const q=id=>document.getElementById(id),msg=(t,o)=>{q("alert").textContent=t;q("alert").className="sf-alert show "+(o?"success":"error")};async function load(){const r=await StockFlowAPI.listSuppliers();q("rows").innerHTML=(r.suppliers||[]).map(x=>`<tr><td>${x.NAME}</td><td>${x.CONTACT_PERSON||"-"}</td><td>${x.PHONE||"-"}</td><td>${x.EMAIL||"-"}</td><td>${x.STATUS}</td><td><button onclick='edit(${JSON.stringify(x)})'>Edit</button> <button onclick="del('${x.ID}')">Delete</button></td></tr>`).join("")}window.edit=x=>["id","name","contactPerson","phone","email","address","status"].forEach(k=>q(k).value=x[k.toUpperCase()]||"");window.del=async id=>{if(confirm("Delete supplier?")){const r=await StockFlowAPI.deleteSupplier(id);msg(r.message,r.success);load()}};q("form").onsubmit=async e=>{e.preventDefault();const d={id:q("id").value,name:q("name").value,contactPerson:q("contactPerson").value,phone:q("phone").value,email:q("email").value,address:q("address").value,status:q("status").value};const r=await StockFlowAPI.saveSupplier(d);msg(r.message,r.success);if(r.success){e.target.reset();load()}};load()})();</script></body></html>
