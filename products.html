<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | StockFlow</title><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="styles.css"></head><body><div class="sf-layout"><aside class="sf-side"><div class="sf-brand">STOCKFLOW</div><div class="sf-nav">
<a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="stock-in.html">Stock In</a><a href="stock-out.html">Stock Out</a><a href="transactions.html">Transactions</a><a href="activity.html">Activity Log</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div></aside><main class="sf-main"><div class="sf-top"><div><div class="sf-title">Products</div><div class="sf-muted">Manage the phone accessories catalog.</div></div><button class="sf-btn secondary" data-menu>☰</button></div><div id="alert" class="sf-alert"></div><div class="sf-card"><form id="form" class="sf-form"><input type="hidden" id="id"><input id="sku" placeholder="SKU" required><input id="name" placeholder="Product name" required><input id="category" placeholder="Category"><input id="supplier" placeholder="Supplier"><input id="price" type="number" min="0" step=".01" placeholder="Selling price"><input id="cost" type="number" min="0" step=".01" placeholder="Unit cost"><input id="stock" type="number" min="0" placeholder="Opening stock"><input id="reorderLevel" type="number" min="0" value="5" placeholder="Reorder level"><select id="status"><option>ACTIVE</option><option>INACTIVE</option></select><div class="full sf-row"><button class="sf-btn">Save Product</button><button type="button" class="sf-btn secondary" id="clear">Clear</button></div></form></div><div class="sf-card"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="main.js"></script><script>(async()=>{const u=await StockFlowAuth.requireAuth();if(!u)return;const q=id=>document.getElementById(id),alert=(t,ok=false)=>{q("alert").textContent=t;q("alert").className="sf-alert show "+(ok?"success":"error")},load=async()=>{const r=await StockFlowAPI.listProducts();if(!r.success)return alert(r.message);q("rows").innerHTML=(r.products||[]).map(p=>`<tr><td>${p.SKU}</td><td><b>${p.NAME}</b></td><td>${p.CATEGORY||"-"}</td><td>₱${Number(p.PRICE||0).toFixed(2)}</td><td>${p.STOCK}</td><td><span class="badge ${Number(p.STOCK)===0?"out":Number(p.STOCK)<=Number(p.REORDER_LEVEL||5)?"low":"active"}">${Number(p.STOCK)===0?"OUT":Number(p.STOCK)<=Number(p.REORDER_LEVEL||5)?"LOW":"OK"}</span></td><td><div class="sf-actions"><button onclick='edit(${JSON.stringify(p)})'>Edit</button><button onclick="del('${p.ID}')">Delete</button></div></td></tr>`).join("")||`<tr><td colspan="7">No products.</td></tr>`};window.edit=p=>{["id","sku","name","category","supplier","price","cost","stock","reorderLevel","status"].forEach(k=>q(k).value=p[k.toUpperCase()]??"")};window.del=async id=>{if(!confirm("Delete this product?"))return;const r=await StockFlowAPI.deleteProduct(id);alert(r.message, r.success);if(r.success)load()};q("form").onsubmit=async e=>{e.preventDefault();const d={id:q("id").value,sku:q("sku").value,name:q("name").value,category:q("category").value,supplier:q("supplier").value,price:q("price").value,cost:q("cost").value,stock:q("stock").value,reorderLevel:q("reorderLevel").value,status:q("status").value};const r=await StockFlowAPI.saveProduct(d);alert(r.message,r.success);if(r.success){e.target.reset();q("id").value="";q("reorderLevel").value=5;load()}};q("clear").onclick=()=>q("form").reset();load()})();</script></body></html>
