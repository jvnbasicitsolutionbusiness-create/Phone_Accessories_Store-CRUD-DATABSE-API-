<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | StockFlow</title><link rel="stylesheet" href="modules.css"></head><body><div class="sf-layout">
<aside class="sf-side">
  <div class="sf-brand">StockFlow</div>
  <div class="sf-nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="categories.html">Categories</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="stock-in.html">Stock In</a>
    <a href="stock-out.html">Stock Out</a>
    <a href="transactions.html">Transactions</a>
    <a href="activity.html">Activity Log</a>
  </div>
</aside>
<main class="sf-main">
<div class="sf-top"><div><div class="sf-title">Products</div><div class="sf-muted">Manage phone accessories and current stock.</div></div><button class="sf-btn" id="newBtn">+ Add Product</button></div>
<div id="alert" class="sf-alert"></div>
<div class="sf-card"><div class="sf-row"><input id="search" placeholder="Search SKU, product, category..."><button class="sf-btn secondary" id="refresh">Refresh</button></div></div>
<div class="sf-card" id="formCard" style="display:none"><h3 id="formTitle">Add Product</h3><form id="form" class="sf-form"><input type="hidden" id="id"><input id="sku" placeholder="SKU" required><input id="name" placeholder="Product name" required><select id="categoryId" required><option value="">Select category</option></select><input id="supplier" placeholder="Supplier name"><input id="price" type="number" min="0" step=".01" placeholder="Selling price"><input id="cost" type="number" min="0" step=".01" placeholder="Unit cost"><input id="reorderLevel" type="number" min="0" placeholder="Reorder level"><input id="imageUrl" placeholder="Image URL"><select id="status"><option>ACTIVE</option><option>INACTIVE</option></select><div class="full sf-row"><button class="sf-btn">Save Product</button><button type="button" class="sf-btn secondary" id="cancel">Cancel</button></div></form></div>
<div class="sf-card"><table><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="inventory-api.js"></script><script src="products.js"></script></body></html>
