<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings | StockFlow</title><link rel="stylesheet" href="modules.css"><link rel="stylesheet" href="styles.css"></head><body><div class="sf-layout"><aside class="sf-side"><div class="sf-brand">STOCKFLOW</div><div class="sf-nav">
<a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="inventory.html">Inventory</a><a href="categories.html">Categories</a><a href="suppliers.html">Suppliers</a><a href="stock-in.html">Stock In</a><a href="stock-out.html">Stock Out</a><a href="transactions.html">Transactions</a><a href="activity.html">Activity Log</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></div></aside><main class="sf-main"><div class="sf-top"><div><div class="sf-title">Settings</div><div class="sf-muted">System configuration and account controls.</div></div><button class="sf-btn secondary" data-menu>☰</button></div><div class="sf-card"><h3>Inventory Settings</h3><p class="sf-muted">Default values used by the STOCKFLOW interface.</p><form id="settings" class="sf-form"><input id="reorder" type="number" min="0" value="5" placeholder="Default reorder level"><select id="theme"><option value="system">System appearance</option><option value="light">Light</option></select><div class="full"><button class="sf-btn">Save Settings</button></div></form><p id="msg"></p></div><div class="sf-card"><h3>Session</h3><p class="sf-muted">Sign out from this browser.</p><button class="sf-btn danger" id="logout">Logout</button></div></main></div><script src="config.js"></script><script src="api.js"></script><script src="auth.js"></script><script src="main.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await StockFlowAuth.requireAuth();if(!u)return;const q=id=>document.getElementById(id),saved=localStorage.getItem("stockflow_reorder");if(saved)q("reorder").value=saved;q("settings").onsubmit=e=>{e.preventDefault();localStorage.setItem("stockflow_reorder",q("reorder").value);q("msg").textContent="Settings saved on this browser."};q("logout").onclick=()=>StockFlowAuth.logout()})</script></body></html>
