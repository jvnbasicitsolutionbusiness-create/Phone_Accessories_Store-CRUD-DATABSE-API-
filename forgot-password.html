<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Recover your StockFlow account">

    <title>Forgot Password | StockFlow</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="auth.css">

</head>


<body class="auth-page">

    <div class="auth-shell compact-shell">


        <!-- BRAND -->

        <div class="auth-brand">

            <a class="brand" href="index.html">

                <span class="brand-mark">
                    S
                </span>

                <span>
                    Stock<span>Flow</span>
                </span>

            </a>

        </div>


        <!-- RECOVERY -->

        <section class="auth-card">


            <div class="back-link">

                <a href="login.html">
                    ← Back to login
                </a>

            </div>


            <div class="auth-card-head">

                <h2>
                    Forgot your password?
                </h2>

                <p>
                    Enter your registered email or phone number.
                    A secure recovery code will be sent during
                    the authentication phase.
                </p>

            </div>


            <div
                id="forgotMessage"
                class="form-message"
                role="alert">
            </div>


            <form
                id="forgotForm"
                novalidate>


                <div class="field">

                    <label for="recoveryContact">

                        Email or phone number

                    </label>


                    <input
                        id="recoveryContact"
                        name="recoveryContact"
                        type="text"
                        autocomplete="email"
                        placeholder="you@gmail.com or 09XXXXXXXXX"
                        required>


                    <small class="field-error"></small>

                </div>


                <button
                    class="btn btn-primary btn-full"
                    type="submit">

                    Continue

                    <span>→</span>

                </button>

            </form>


            <div class="security-note">

                <span>
                    🔒
                </span>

                <div>

                    <strong>
                        Privacy protected
                    </strong>

                    <small>
                        Never share verification codes
                        or passwords with anyone.
                    </small>

                </div>

            </div>

        </section>

    </div>


    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>

</body>

</html>
