<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | StockFlow</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell compact-shell">
    <div class="auth-brand"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>Stock<span>Flow</span></span></a></div>
    <section class="auth-card">
      <div class="back-link"><a href="login.html">← Back to login</a></div>
      <div class="auth-card-head"><h2>Forgot your password?</h2><p>Enter your registered email or phone number. In the production version, a secure recovery code will be sent to you.</p></div>
      <div id="forgotMessage" class="form-message" role="alert"></div>
      <form id="forgotForm" novalidate>
        <div class="field"><label for="recoveryContact">Email or phone number</label><input id="recoveryContact" type="text" placeholder="you@gmail.com or 09XXXXXXXXX"><small class="field-error"></small></div>
        <button class="btn btn-primary btn-full" type="submit">Continue <span>→</span></button>
      </form>
      <div class="security-note"><span>🔒</span><div><strong>Privacy protected</strong><small>Do not share verification codes or passwords with anyone.</small></div></div>
    </section>
  </div>
  <script src="js/config.js"></script><script src="js/auth.js"></script>
</body>
</html>
